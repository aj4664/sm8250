name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Kernel Source Git URL (源码地址)'
        required: false
        default: 'https://github.com/aj4664/sm8250.git'
        type: string

      branch:
        description: 'Kernel Source Branch (源码分支)'
        required: false
        default: 'android12'
        type: string

      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'cas'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi

      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false

      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both


jobs:
  build-kernel:

    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}

    runs-on: ubuntu-latest

    steps:

    - name: Clone Kernel Source
      run: |

        SOURCE="${{ github.event.inputs.source }}"
        BRANCH="${{ github.event.inputs.branch }}"

        echo "Source: $SOURCE"
        echo "Branch: $BRANCH"

        git clone \
          --depth=1 \
          --branch "$BRANCH" \
          --single-branch \
          "$SOURCE" \
          kernel


    - name: Set up Environment
      run: |

        sudo apt-get update

        sudo apt-get install -y \
          bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip \
          zlib1g-dev python3


    - name: Setup ccache
      run: |

        ccache -M 20G

        echo "CCACHE_DIR=$HOME/.cache/ccache_mikernel" >> $GITHUB_ENV


    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-


    - name: Setup zyc-clang 16 Toolchain
      run: |

        mkdir -p $HOME/zyc-clang

        cd $HOME/zyc-clang

        wget -q \
        https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz

        tar -zxvf Clang-16.0.6-20260510.tar.gz

        echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH


    - name: Run Build Script
      run: |

        cd kernel

        chmod +x build_kernel.sh


        ARGS="${{ github.event.inputs.device }}"


        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi


        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi


        echo "Executing:"
        echo "./build_kernel.sh $ARGS"


        ./build_kernel.sh $ARGS



    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:

        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}

        path: kernel/APTKernel_*.zip

        compression-level: 0
